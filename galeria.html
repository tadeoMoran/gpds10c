<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Galería de fotos de focas, lobos marinos y elefantes marinos de Mundo Foca." />
    <title>Galería | Mundo Foca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/main.css" />
</head>
<body class="d-flex flex-column min-vh-100">
    <gdps-header></gdps-header>

    <main class="flex-grow-1">
        <section id="galeria-encabezado" class="page-hero position-relative d-flex align-items-center text-center text-white overflow-hidden">
            <img src="img/banner-hero.webp"
                 alt=""
                 width="1920"
                 height="960"
                 class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover imagen-fondo"
                 loading="lazy" />
            <div class="position-absolute top-0 start-0 w-100 h-100 sombra-oscura imagen-fondo"></div>
            <div class="container position-relative py-4">
                <h1 class="display-5 fw-bold">Galería</h1>
                <p class="lead">Un vistazo visual a nuestro trabajo.</p>
            </div>
        </section>

        <section id="galeria-volver" class="container pt-4">
            <a href="../inicio/index.html" class="btn btn-mas-info rounded-0" title="Volver a la página principal">
                <i class="bi bi-arrow-left text-chevron" aria-hidden="true"></i> Volver al inicio
            </a>
        </section>

        <section id="galeria-fotos" class="py-5 bg-white">
            <div class="container">
                <h2 class="text-center mb-5">Mejores fotos</h2>
                <div class="row g-4">
                    <div class="col-md-6 col-lg-4">
                        <div class="card border-0 shadow-sm hover-lift overflow-hidden h-100">
                            <div class="ratio ratio-4x3">
                                <img src="img/welcome-foca.webp"
                                     alt="Foca asomando la cabeza en aguas tranquilas"
                                     width="900"
                                     height="900"
                                     class="object-fit-cover"
                                     loading="lazy" />
                            </div>
                            <div class="bg-brand-primary text-white p-3">
                                <p class="mb-0 fw-semibold">Foca curiosa</p>
                                <p class="mb-0 small text-white-50">Phoca vitulina</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="card border-0 shadow-sm hover-lift overflow-hidden h-100">
                            <div class="ratio ratio-4x3">
                                <img src="img/categoria-lobo-marino.webp"
                                     alt="Lobo marino mirando hacia arriba"
                                     width="700"
                                     height="700"
                                     class="object-fit-cover"
                                     loading="lazy" />
                            </div>
                            <div class="bg-brand-primary text-white p-3">
                                <p class="mb-0 fw-semibold">Lobo marino</p>
                                <p class="mb-0 small text-white-50">Otariidae</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="card border-0 shadow-sm hover-lift overflow-hidden h-100">
                            <div class="ratio ratio-4x3">
                                <img src="img/categoria-elefante-marino.webp"
                                     alt="Dos elefantes marinos frente a frente en la orilla"
                                     width="700"
                                     height="700"
                                     class="object-fit-cover"
                                     loading="lazy" />
                            </div>
                            <div class="bg-brand-primary text-white p-3">
                                <p class="mb-0 fw-semibold">Elefantes marinos</p>
                                <p class="mb-0 small text-white-50">Mirounga</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="card border-0 shadow-sm hover-lift overflow-hidden h-100">
                            <div class="ratio ratio-4x3">
                                <img src="img/conocer-de-cerca.webp"
                                     alt="Foca nadando bajo el agua soltando una burbuja de aire"
                                     width="1200"
                                     height="900"
                                     class="object-fit-cover"
                                     loading="lazy" />
                            </div>
                            <div class="bg-brand-primary text-white p-3">
                                <p class="mb-0 fw-semibold">Nado libre</p>
                                <p class="mb-0 small text-white-50">Aguas abiertas</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="card border-0 shadow-sm hover-lift overflow-hidden h-100">
                            <div class="ratio ratio-4x3">
                                <img src="img/novedad-galeria.webp"
                                     alt="Cría de foca gris sobre piedras en la orilla"
                                     width="800"
                                     height="600"
                                     class="object-fit-cover"
                                     loading="lazy" />
                            </div>
                            <div class="bg-brand-primary text-white p-3">
                                <p class="mb-0 fw-semibold">Cría de foca gris</p>
                                <p class="mb-0 small text-white-50">Halichoerus grypus</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="card border-0 shadow-sm hover-lift overflow-hidden h-100">
                            <div class="ratio ratio-4x3">
                                <img src="img/novedad-nosotros.webp"
                                     alt="Focas descansando sobre rocas junto al mar"
                                     width="800"
                                     height="600"
                                     class="object-fit-cover"
                                     loading="lazy" />
                            </div>
                            <div class="bg-brand-primary text-white p-3">
                                <p class="mb-0 fw-semibold">Descanso en la costa</p>
                                <p class="mb-0 small text-white-50">Islandia</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <gdps-footer></gdps-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
