<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ponte en contacto con el equipo de Mundo Foca a través de nuestro formulario." />
    <title>Contacto | Mundo Foca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/main.css" />
</head>
<body class="d-flex flex-column min-vh-100">
    <gdps-header></gdps-header>

    <main class="flex-grow-1">
        <section id="contacto-encabezado" class="page-hero position-relative d-flex align-items-center text-center text-white overflow-hidden">
            <img src="img/banner-hero.webp"
                 alt=""
                 width="1920"
                 height="960"
                 class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover imagen-fondo"
                 loading="lazy" />
            <div class="position-absolute top-0 start-0 w-100 h-100 sombra-oscura imagen-fondo"></div>
            <div class="container position-relative py-4">
                <h1 class="display-5 fw-bold">Contacto</h1>
                <p class="lead">¿Tienes alguna consulta? Escríbenos.</p>
            </div>
        </section>

        <section id="contacto-volver" class="bg-light pt-4">
            <div class="container">
                <a href="../inicio/index.html" class="btn btn-mas-info rounded-0" title="Volver a la página principal">
                    <i class="bi bi-arrow-left text-chevron" aria-hidden="true"></i> Volver al inicio
                </a>
            </div>
        </section>

        <section id="contacto-formulario" class="py-5 bg-light">
            <div class="container col-lg-9">
                <h2 class="mb-4">Formulario de contacto</h2>
                <form id="formulario-contacto" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="contacto-nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="contacto-nombre" name="nombre" required minlength="2" />
                                <div class="invalid-feedback">Ingresa tu nombre.</div>
                            </div>
                            <div class="mb-3">
                                <label for="contacto-email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="contacto-email" name="email" required />
                                <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
                            </div>
                            <div class="mb-3 mb-md-0">
                                <label for="contacto-telefono" class="form-label">Teléfono <span class="text-muted">(opcional)</span></label>
                                <input type="tel" class="form-control" id="contacto-telefono" name="telefono" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="contacto-mensaje" class="form-label">Mensaje</label>
                            <textarea class="form-control h-100" id="contacto-mensaje" name="mensaje" rows="7" required minlength="10"></textarea>
                            <div class="invalid-feedback">Cuéntanos tu consulta (mínimo 10 caracteres).</div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-mas-info rounded-0 mt-4">
                        <i class="bi bi-send text-chevron" aria-hidden="true"></i> Enviar mensaje
                    </button>
                </form>
            </div>
        </section>
    </main>

    <gdps-footer></gdps-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/main.js"></script>
    <script src="js/contacto.js"></script>
</body>
</html>
